name: Build postmarketOS for xiaomi-xun

on:
  workflow_dispatch:
  push:
    branches: [ci-trigger]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          key: ccache-sm6225-${{ github.sha }}
          restore-keys: |
            ccache-sm6225-

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git \
            multipath-tools parted e2fsprogs \
            android-sdk-libsparse-utils device-tree-compiler xxd cpio gzip
          curl -sL -o /tmp/mkbootimg.py \
            https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/mkbootimg.py
          sudo cp /tmp/mkbootimg.py /usr/local/bin/mkbootimg.py
          sudo chmod +x /usr/local/bin/mkbootimg.py

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git $HOME/pmbootstrap
          sudo ln -sf $HOME/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap

      - name: Clone pmaports
        run: |
          WORK=$HOME/.local/var/pmbootstrap
          mkdir -p $WORK/cache_git
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git \
            $WORK/cache_git/pmaports
          echo 8 > $WORK/version

      - name: Install xun packages into pmaports
        run: |
          PMA=$HOME/.local/var/pmbootstrap/cache_git/pmaports
          rm -rf $PMA/device/testing/device-xiaomi-xun
          cp -r device/testing/device-xiaomi-xun $PMA/device/testing/
          rm -rf $PMA/device/archived/linux-postmarketos-qcom-sm6225
          cp -r device/kernel-package $PMA/device/archived/linux-postmarketos-qcom-sm6225
          cd $PMA
          git add -A
          git -c user.email=ci@x -c user.name=ci commit -m "xun port"

      - name: Write pmbootstrap config
        run: |
          mkdir -p $HOME/.config
          sudo mkdir -p /root/.config
          printf '%s\n' \
            '[pmbootstrap]' \
            'aports = /home/runner/.local/var/pmbootstrap/cache_git/pmaports' \
            'build_default_device_arch = False' \
            'ccache_size = 5G' \
            'device = xiaomi-xun' \
            'is_default_channel = True' \
            'jobs = 4' \
            'kernel = mainline' \
            'service_manager = openrc' \
            'ui = none' \
            'work = /home/runner/.local/var/pmbootstrap' \
            > $HOME/.config/pmbootstrap_v3.cfg
          sudo cp $HOME/.config/pmbootstrap_v3.cfg /root/.config/pmbootstrap_v3.cfg

      - name: Prepare ccache dir
        run: |
          sudo mkdir -p /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64
          sudo chmod -R 777 /home/runner/.local/var/pmbootstrap/cache_ccache_aarch64

      - name: Build kernel
        run: sudo -E pmbootstrap --as-root build --force linux-postmarketos-qcom-sm6225

      - name: Build device package
        run: sudo -E pmbootstrap --as-root build --force device-xiaomi-xun

      - name: Install
        run: sudo -E pmbootstrap --as-root install --password=147147

      - name: Export
        run: sudo -E pmbootstrap --as-root export

      - name: Patch boot + build padded vendor_boot + FLASHING.txt
        run: |
          set -e
          EXP=/tmp/postmarketOS-export
          sudo chmod -R a+rX "$EXP" || true

          echo "--- boot.img header before patch ---"
          sudo xxd -l 48 $EXP/boot.img || true
          echo 99010020 | xxd -r -p | sudo dd of=$EXP/boot.img bs=1 seek=16 count=4 conv=notrunc
          echo "--- boot.img header after patch ---"
          sudo xxd -l 48 $EXP/boot.img || true
          sudo cp -a $EXP/boot.img $EXP/recovery.img

          sudo rm -f $EXP/vendor_boot.img

          DTB=""
          for p in $EXP/dtbs/sm6225-xiaomi-xun.dtb $EXP/dtbs/qcom/sm6225-xiaomi-xun.dtb; do
            if sudo test -f "$p"; then DTB="$p"; break; fi
          done
          if [ -z "$DTB" ]; then
            echo "ERROR: mainline DTB not found in export"
            sudo find $EXP -name '*.dtb' -ls || true
            exit 1
          fi
          echo "Using DTB: $DTB ($(sudo stat -c%s "$DTB") bytes)"

          VRAM=/tmp/vendor_ramdisk.cpio.gz
          echo | cpio -o -H newc 2>/dev/null | gzip -n > "$VRAM"
          dd if=/dev/zero bs=1024 count=64 >> "$VRAM" 2>/dev/null || true

          sudo python3 /usr/local/bin/mkbootimg.py \
            --header_version 4 \
            --pagesize 4096 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x01f00000 \
            --vendor_cmdline "earlycon=msm_geni_serial,0x4a90000 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused loglevel=8" \
            --vendor_ramdisk "$VRAM" \
            --dtb "$DTB" \
            --vendor_boot /tmp/vendor_boot_raw.img

          echo "--- raw vendor_boot header ---"
          xxd -l 64 /tmp/vendor_boot_raw.img || true
          echo "raw size: $(stat -c%s /tmp/vendor_boot_raw.img)"

          STOCK_SIZE=100663296
          cp /tmp/vendor_boot_raw.img /tmp/vendor_boot_padded.img
          CUR=$(stat -c%s /tmp/vendor_boot_padded.img)
          if [ "$CUR" -lt "$STOCK_SIZE" ]; then
            PAD=$((STOCK_SIZE - CUR))
            echo "Padding vendor_boot by $PAD bytes to $STOCK_SIZE"
            dd if=/dev/zero bs=1M count=$(( (PAD + 1048575) / 1048576 )) status=none >> /tmp/vendor_boot_padded.img
          fi
          truncate -s "$STOCK_SIZE" /tmp/vendor_boot_padded.img
          sudo cp /tmp/vendor_boot_padded.img $EXP/vendor_boot.img
          sudo chmod 644 $EXP/vendor_boot.img

          echo "--- final vendor_boot ---"
          sudo xxd -l 64 $EXP/vendor_boot.img || true
          echo "final size: $(sudo stat -c%s $EXP/vendor_boot.img)"

          printf '%s\n' \
            'Xiaomi Pad SE (xun) - postmarketOS flash instructions' \
            '=====================================================' \
            '' \
            'vendor_boot is padded to stock size (96 MB) with mainline DTB.' \
            '' \
            '1. Boot into fastboot (Power + Vol Down).' \
            '2. From second device:' \
            '' \
            '   fastboot flash boot_a boot.img' \
            '   fastboot flash vendor_boot_a vendor_boot.img' \
            '   fastboot set_active a' \
            '   fastboot reboot' \
            '' \
            'If stuck, restore stock boot + vendor_boot then reboot.' \
            | sudo tee $EXP/FLASHING.txt > /dev/null

          echo "=== Artifact contents ==="
          sudo ls -la $EXP/
          sudo ls -la $EXP/dtbs/ 2>/dev/null || true

      - name: Check ccache state
        if: always()
        run: sudo du -sh /home/runner/.local/var/pmbootstrap/cache_ccache 2>/dev/null || echo "MISSING"

      - name: Verify export contents
        if: always()
        run: |
          sudo ls -la /tmp/postmarketOS-export/ || true
          sudo ls -la /tmp/postmarketOS-export/dtbs/ 2>/dev/null || true

      - name: Dump pmbootstrap log
        if: always()
        run: |
          echo "=========== REAL ERRORS ==========="
          sudo grep -nE "error:|Error 1|>>> ERROR|No rule to make|undefined reference|FATAL ERROR|dtc:|Reference to non-existent" \
            /home/runner/.local/var/pmbootstrap/log.txt | tail -40 || true
          echo "=========== last 40 lines ==========="
          sudo tail -n 40 /home/runner/.local/var/pmbootstrap/log.txt || true

      - name: Fix artifact permissions
        if: always()
        run: sudo chmod -R 755 /tmp/postmarketOS-export/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmos-xun-images
          path: /tmp/postmarketOS-export/
          if-no-files-found: warn
          retention-days: 14
