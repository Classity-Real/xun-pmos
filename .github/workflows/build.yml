name: Build postmarketOS for xiaomi-xun

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git \
            multipath-tools parted e2fsprogs expect android-sdk-libsparse-utils

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git $HOME/pmbootstrap
          sudo ln -sf $HOME/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap

      - name: Init pmbootstrap
        run: |
          expect <<'EOF'
          set timeout 30
          log_user 1
          spawn pmbootstrap init

          # Work path
          expect -re {Work path\s*\[[^\]]*\]:\s*$} { send "\r" }

          # pmaports path - may or may not appear, use a combined matcher
          expect {
            -re {pmaports path\s*\[[^\]]*\]:\s*$} { send "\r"; exp_continue }
            -re {Channel\s*\[edge\]:\s*$}           { send "edge\r" }
            timeout { puts "STUCK after pmaports path"; exit 1 }
          }

          expect -re {Vendor\s*\[[^\]]*\]:\s*$}            { send "xiaomi\r" }
          expect -re {Device codename:\s*$}                { send "xun\r" }
          expect {
            -re {not found.*Add it now\?.*\[y\]:\s*$}      { send "y\r" }
            -re {Create a new device port\?.*\[y\]:\s*$}   { send "y\r" }
            timeout { puts "STUCK at create-device prompt"; exit 1 }
          }
          expect -re {architecture.*\[aarch64\]:\s*$}      { send "\r" }
          expect -re {User interface:}                     { send "none\r" }
          expect -re {Kernel.*\[mainline\]:\s*$}           { send "\r" }
          expect -re {Chassis:\s*$}                        { send "tablet\r" }
          expect -re {Flash method:\s*$}                   { send "fastboot\r" }
          expect -re {Known working boot.img\?.*:\s*$}     { send "\r" }
          expect -re {Boot partition size.*:\s*$}          { send "\r" }
          expect -re {Extra packages.*:\s*$}               { send "\r" }
          expect -re {Default locale.*:\s*$}               { send "\r" }
          expect -re {Default timezone.*:\s*$}             { send "\r" }
          expect -re {Default username.*:\s*$}             { send "\r" }
          expect -re {Device hostname.*:\s*$}              { send "\r" }
          expect -re {Change them\?.*\[n\]:\s*$}           { send "n\r" }
          expect -re {Copy these public keys.*\[n\]:\s*$}  { send "n\r" }
          expect -re {Build outdated packages.*\[y\]:\s*$} { send "y\r" }
          expect -re {Zap existing.*\[y\]:\s*$}            { send "y\r" }
          expect eof
          EOF

      - name: Install device + kernel packages
        run: |
          PMA=$HOME/.local/var/pmbootstrap/cache_git/pmaports
          rm -rf $PMA/device/testing/device-xiaomi-xun
          cp -r device/testing/device-xiaomi-xun $PMA/device/testing/
          rm -rf $PMA/device/archived/linux-postmarketos-qcom-sm6225
          cp -r device/kernel-package $PMA/device/archived/linux-postmarketos-qcom-sm6225
          cd $PMA
          git add -A
          git -c user.email=ci@x -c user.name=ci commit -m "xun port" || true

      - name: Build kernel
        run: pmbootstrap build --force linux-postmarketos-qcom-sm6225

      - name: Build device package
        run: pmbootstrap build --force device-xiaomi-xun

      - name: Install
        run: pmbootstrap install --password=147147

      - name: Export
        run: pmbootstrap export

      - uses: actions/upload-artifact@v4
        with:
          name: pmos-xun-images
          path: /tmp/postmarketOS-export/
          if-no-files-found: error
          retention-days: 14
